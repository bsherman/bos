---
name: bOS Build Desktop
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "41 6 * * *"  # 6:41 UTC daily
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".editorconfig"
      - ".gitignore"
      - "yamlfmt.yml"
      - ".github/renovate.json"
      - ".github/semantic.yml"
      - ".claude/**"
      - ".github/workflows/cleanup-old-images.yml"
  workflow_call:
    inputs:
      changed_only:
        description: >-
          Build only variants whose upstream base digest changed.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      changed_only:
        description: >-
          Build only variants whose upstream base digest changed.
        type: boolean
        default: false
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  build-image:
    name: Build Images
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        image_flavor: ["Bazzite"]
    with:
      image_flavor: ${{ matrix.image_flavor }}
      changed_only: ${{ inputs.changed_only || false }}
